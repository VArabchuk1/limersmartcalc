  <meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limercoin Calculator</title>
<style>
:root{--bg:#10121c;--card:#1a1d2d;--head:#262a40;--line:#2f3450;--accent:#8fcc1f;--accent2:#b6e84a;--text:#fff;--muted:#8a90ab;--coop:#353b70;--coopt:#b9c2ff;--bh:#3d6b0c;--bht:#c7f27a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1d2140,var(--bg));background-color:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;min-height:100vh}
.wrap{max-width:960px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
h1{font-size:20px;margin:0;color:#fff;letter-spacing:.3px}h1 span{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.label{font-size:12px;color:var(--muted);margin-bottom:6px}
textarea{width:100%;height:100px;resize:vertical;background:#12141f;color:#dfe3f5;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 monospace}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
input,select{background:#12141f;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=number]{width:120px}
.pw{display:flex;gap:6px}.pw select{width:84px}
button{background:var(--accent);color:#16200a;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:700}
button:hover{background:var(--accent2)}button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}button.ghost:hover{background:#8fcc1f22}
.sum{font-size:12px;color:var(--muted);margin-top:10px}.sum b{color:var(--accent)}
.status{font-size:12px;margin-top:8px;min-height:16px}.status.err{color:#ff7b7b}.status.ok{color:var(--accent)}
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-weight:700;font-size:14px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px}
.b-coop{background:var(--coop);color:var(--coopt)}.b-bh{background:var(--bh);color:var(--bht)}
.cnt{color:var(--muted);font-size:12px;font-weight:400}
.table-wrapper{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.sec-coop .table-wrapper{border-top:3px solid #5b66d8}.sec-bh .table-wrapper{border-top:3px solid var(--accent)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{padding:11px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--head);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;text-align:center;border-bottom:1px solid #ffffff0d;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ffffff0a}
th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:2px 0 4px rgba(0,0,0,.35)}
th:first-child{background:var(--head)}
tbody tr:hover td:first-child{background:#222640}
tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--accent),2px 0 4px rgba(0,0,0,.35)}
.coin{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px}
.ico{position:relative;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;color:#fff;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card);opacity:0}
.tick{font-weight:700;font-size:11px}
.here{font-size:9px;color:var(--accent)}
.net{color:var(--coopt)}.sec-bh .net{color:var(--bht)}
.reward{font-weight:700}.mine-r{color:var(--accent2);font-weight:700}
.empty{padding:26px;text-align:center;color:var(--muted)}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}

[hidden]{display:none!important}
.usd{font-size:10px;color:var(--muted);margin-top:2px}
.rates{font-size:11px;color:var(--muted);margin-top:4px}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;padding:16px;margin:auto}
.modal-box h2{margin:0 0 10px;font-size:17px;color:var(--accent)}
.modal-box ol{margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.6}
.modal-box figure{margin:0 0 12px}.modal-box figcaption{font-size:11px;color:var(--muted);margin-top:4px}
.modal-box img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.tip{background:#8fcc1f1a;border:1px solid #8fcc1f55;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:12px}
</style></head><body><div class="wrap">

let lang = 'en';
const T = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const UNITS = {'gh/s': 1, 'th/s': 1e3, 'ph/s': 1e6, 'eh/s': 1e9, 'zh/s': 1e12};
const PW_RE = /(\d+(?:\.\d+)?)\s*([GTPEZ]h\/s)/gi;
const COLORS = {BTC: ['#f7931a', '₿'], DOGE: ['#c2a633', 'Ð'], LTC: ['#345d9d', 'Ł'], SOL: ['linear-gradient(135deg,#9945ff,#14f195)', '◎'],
                LMT: ['#00b86b', 'L'], LMG: ['#d99a00', 'G']};
const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
let pools = [];
const GECKO = {BTC: 'bitcoin', DOGE: 'dogecoin', LTC: 'litecoin', SOL: 'solana'};
let prices = {}, ratesInfo = {state: 'load'};
const priceOf = sym => sym === 'LMT' ? 1 : sym === 'LMG' ? null : (prices[sym] ?? null);
function fmtUsd(v) {
    if (!(v > 0)) return '0.00';
    if (v >= 0.01) return v.toFixed(2);
    return v.toFixed(Math.min(10, 2 - Math.floor(Math.log10(v))));
}
const usdLine = (sym, v) => { const pr = priceOf(sym); return pr == null ? '' : `<div class="usd">≈ ${fmtUsd(v * pr)} USDT</div>`; };

function renderRates() {
    const el = $('rates');
    if (ratesInfo.state === 'ok') el.textContent = T('rates_ok', new Date(ratesInfo.t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}));
    else el.textContent = ratesInfo.state === 'err' ? T('rates_err') : T('rates_load');
}
async function loadPrices() {
    try {
        const c = JSON.parse(store.get('lc_prices') || 'null');
        if (c && c.v) {
            prices = c.v; ratesInfo = {state: 'ok', t: c.t};
            if (Date.now() - c.t < 5 * 60 * 1000) { renderRates(); render(); return; }
        }
    } catch (e) { /* ignore */ }
    try {
        const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + Object.values(GECKO).join(',') + '&vs_currencies=usd');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json(), v = {};
        for (const s in GECKO) { const x = d[GECKO[s]] && d[GECKO[s]].usd; if (x != null) v[s] = x; }
        if (!Object.keys(v).length) throw new Error('empty');
        prices = v; ratesInfo = {state: 'ok', t: Date.now()};
        store.set('lc_prices', JSON.stringify({t: ratesInfo.t, v}));
    } catch (e) {
        if (!Object.keys(prices).length) ratesInfo = {state: 'err'};
    }
    renderRates(); render();
}
let statusState = null;   // {key, n}

/* ---------- парсинг ---------- */
function powerGh(m) { return parseFloat(m[1]) * UNITS[m[2].toLowerCase()]; }

function parsePaste(text) {
    const clean = text.replace(/\u00a0/g, ' ').replace(/,/g, '');
    const ti = clean.search(/Total pools info/i);
    const body = ti >= 0 ? clean.slice(0, ti) : clean;
    const tail = ti >= 0 ? clean.slice(ti) : '';
    const heads = [...body.matchAll(/([A-Za-z0-9]{2,6})\s*-\s*(Coop|Hunter)/gi)];
    const list = [];
    heads.forEach((h, i) => {
        const end = i + 1 < heads.length ? heads[i + 1].index : body.length;
        const chunk = body.slice(h.index + h[0].length, end);
        const pw = [...chunk.matchAll(PW_RE)];
        if (pw.length < 2) return;
        const after = chunk.slice(pw[1].index + pw[1][0].length);
        const r = after.match(/(\d+(?:\.\d+)?)\s*([A-Za-z]{2,6})/);
        if (!r) return;
        list.push({
            name: h[1].toUpperCase(), type: h[2].toLowerCase() === 'coop' ? 'coop' : 'bh',
            my: powerGh(pw[0]), pool: powerGh(pw[1]), reward: parseFloat(r[1]), rewardStr: r[1], symbol: r[2].toUpperCase()
        });
    });
    const tp = [...tail.matchAll(PW_RE)];
    const total = tp.length ? powerGh(tp[0]) : list.reduce((s, p) => s + p.my, 0);
    return {list, total};
}

/* ---------- форматування (лише для екрана) ---------- */
function fmtPower(gh) {
    if (!gh) return '0 Gh/s';
    const u = ['Gh/s', 'Th/s', 'Ph/s', 'Eh/s', 'Zh/s'];
    let i = 0, v = gh;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return v.toFixed(3) + ' ' + u[i];
}
function fmtCoin(v) {
    if (!(v > 0)) return '0';
    const d = Math.min(14, Math.max(2, 3 - Math.floor(Math.log10(v))));
    return v.toFixed(d);
}
function setPower(gh) {
    const opts = [1e9, 1e6, 1e3, 1];
    const u = opts.find(o => gh >= o) || 1;
    $('unit').value = String(u);
    $('power').value = gh ? String(+(gh / u).toPrecision(12)) : '0';
}
const myPowerGh = () => (parseFloat($('power').value) || 0) * Number($('unit').value);

/* ---------- розрахунок ---------- */
function calcPool(p, P, blocksPerDay) {
    const denom = p.pool - p.my + P;            // пул із урахуванням моєї потужності
    const share = denom > 0 && P > 0 ? P / denom : 0;
    const block = share * p.reward;
    return {block, day: block * blocksPerDay, week: block * blocksPerDay * 7, month: block * blocksPerDay * 30};
}

function iconHtml(sym) {
    const [bg, glyph] = COLORS[sym] || ['#556', sym[0]];
    const url = `https://limercoin.com/static/img/coins/${sym.toLowerCase()}_icon.svg`;
    return `<div class="ico" style="background:${bg}">${esc(glyph)}<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" onload="this.style.opacity=1" onerror="this.remove()"></div>`;
}

function sectionHtml(type, list, P, bpd) {
    const rows = list.map(p => {
        const c = calcPool(p, P, bpd);
        return `<tr class="${p.my > 0 ? 'mine' : ''}">
<td><div class="coin">${iconHtml(p.name)}<span class="tick">${esc(p.name)}</span>${p.my > 0 ? `<span class="here">${T('here')}</span>` : ''}</div></td>
<td class="net">${fmtPower(p.pool)}</td>
<td class="reward">${esc(p.rewardStr)} ${esc(p.symbol)}</td>
<td class="mine-r">${fmtCoin(c.block)}${usdLine(p.name, c.block)}</td>
<td>${fmtCoin(c.day)}${usdLine(p.name, c.day)}</td><td>${fmtCoin(c.week)}${usdLine(p.name, c.week)}</td><td>${fmtCoin(c.month)}${usdLine(p.name, c.month)}</td></tr>`;
    }).join('');
    return `<div class="sec sec-${type}">
<div class="sec-h"><span class="badge b-${type}">${type === 'coop' ? 'COOP' : 'HUNTER'}</span><span>${T(type)}</span><span class="cnt">${list.length}</span></div>
<div class="table-wrapper"><table><thead><tr><th>${T('h_coin')}</th><th>${T('h_net')}</th><th>${T('h_rew')}</th><th>${T('h_my')}</th><th>${T('h_day')}</th><th>${T('h_week')}</th><th>${T('h_month')}</th></tr></thead>
<tbody>${rows}</tbody></table></div></div>`;
}

function render() {
    const interval = parseFloat($('interval').value) || 0;
    const bpd = interval > 0 ? 86400 / (interval * 60) : 0;
    const P = myPowerGh();
    $('sum').innerHTML = T('sum', fmtPower(P), bpd ? +bpd.toFixed(2) : '—');
    if (!pools.length) { $('tables').innerHTML = `<div class="card empty">${T('empty')}</div>`; return; }
    $('tables').innerHTML =
        (pools.some(p => p.type === 'coop') ? sectionHtml('coop', pools.filter(p => p.type === 'coop'), P, bpd) : '') +
        (pools.some(p => p.type === 'bh') ? sectionHtml('bh', pools.filter(p => p.type === 'bh'), P, bpd) : '');
}

function renderStatus() {
    const st = $('status');
    if (!statusState) { st.textContent = ''; st.className = 'status'; return; }
    st.textContent = statusState.key === 'ok' ? T('ok', statusState.n) : T('bad');
    st.className = 'status ' + (statusState.key === 'ok' ? 'ok' : 'err');
}

function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
    document.querySelectorAll('[data-ip]').forEach(el => el.placeholder = T(el.dataset.ip));
    renderStatus();
    renderRates();
    render();
}

function onPaste() {
    const text = $('paste').value;
    store.set('lc_paste', text);
    if (!text.trim()) { pools = []; statusState = null; renderStatus(); render(); return; }
    const res = parsePaste(text);
    pools = res.list;
    if (!pools.length) statusState = {key: 'bad'};
    else { statusState = {key: 'ok', n: pools.length}; setPower(res.total); }
    renderStatus();
    render();
}
